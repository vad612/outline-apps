import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction

apply plugin: 'com.android.application'

def tvBannerSource = file("${rootProject.projectDir}/../../resources/icons/android/tv_banner.png")

abstract class CopyTvBannerTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getSourceFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void copyBanner() {
        project.sync {
            from(sourceFile) {
                into('drawable-xhdpi')
            }
            into(outputDirectory)
        }
    }
}

def copyTvBanner = tasks.register('copyTvBanner', CopyTvBannerTask) {
    sourceFile.set(tvBannerSource)
}

android {
    namespace "org.outline.client"
    compileSdk 36
    
    defaultConfig {
        // Ship under the same package id as the existing Cordova client so the
        // Play Store delivers this as an in-place update. That is a hard
        // requirement for the Cordova->Capacitor localStorage migration: the new
        // app can only read the legacy file:// storage if it inherits the old
        // app's data directory, which only happens on a same-id upgrade.
        // (namespace stays org.outline.client — that is the code package, not the
        // install identity.)
        applicationId "org.outline.android.client"
        minSdk rootProject.ext.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res.addGeneratedSourceDirectory(copyTvBanner) {
            it.outputDirectory
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
}

apply from: 'capacitor.build.gradle'
